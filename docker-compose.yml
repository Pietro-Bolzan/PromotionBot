# Local Postgres for development. Credentials come from .env (see .env.example);
# none are stored here.
services:
  db:
    image: postgres:16
    container_name: amazonbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amazonbot}
      POSTGRES_USER: ${POSTGRES_USER:-amazonbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Published on the loopback interfaces only: binding every interface would
      # expose the database to the whole network (or the internet, on a server).
      # Both IPv4 and IPv6, because "localhost" resolves to ::1 first on Windows;
      # with IPv4 alone, each connection to localhost hangs before falling back.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "[::1]:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
